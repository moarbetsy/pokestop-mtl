<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Marketplace — Cards & Collectibles</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <h1 class="logo">Marketplace</h1>
      <p class="tagline">Cards & Collectibles</p>
    </div>
  </header>

  <main class="main">
    <section class="controls">
      <div class="search-wrap">
        <label for="search" class="sr-only">Search items</label>
        <input type="search" id="search" class="search-input" placeholder="Search by title…" autocomplete="off">
      </div>
      <p class="results-count" id="results-count"></p>
    </section>

    <section class="grid" id="grid" aria-live="polite">
      <!-- Cards injected by JS -->
    </section>

    <div class="empty-state hidden" id="empty-state">
      <p>No items match your search.</p>
    </div>
  </main>

  <div class="popup-overlay hidden" id="popup-overlay" aria-hidden="true">
    <div class="popup" id="popup" role="dialog" aria-modal="true" aria-labelledby="popup-title">
      <button type="button" class="popup-close" id="popup-close" aria-label="Close">&times;</button>
      <div class="popup-image-wrap">
        <img class="popup-image" id="popup-image" src="" alt="">
      </div>
      <div class="popup-body">
        <h2 class="popup-title" id="popup-title"></h2>
        <p class="popup-price" id="popup-price"></p>
        <p class="popup-status" id="popup-status"></p>
        <button type="button" class="popup-buy" id="popup-buy">Buy</button>
      </div>
    </div>
  </div>

  <footer class="site-footer">
    <p>Marketplace — HTML, CSS & JS</p>
  </footer>

  <script src="data.js"></script>
  <script src="script.js"></script>
</body>
</html>
